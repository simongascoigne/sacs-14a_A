export default {
  // Executes on Cloudflare Cron schedule
  async scheduled(event, env, ctx) {
    ctx.waitUntil(triggerWorkflow(env));
  },

  // Executes on manual browser visit
  async fetch(request, env, ctx) {
    const url = new URL(request.url);

    // Ignore browser tab icon requests so it doesn't double-fire
    if (url.pathname === "/favicon.ico" || url.pathname === "/robots.txt") {
      return new Response(null, { status: 204 });
    }

    const response = await triggerWorkflow(env);
    if (response.status === 204) {
      return new Response("GitHub Action triggered successfully! (Status 204)", { status: 200 });
    }
    const errText = await response.text();
    return new Response(`Failed: ${response.status} - ${errText}`, { status: response.status });
  }
};

async function triggerWorkflow(env) {
  return fetch(
    "https://api.github.com/repos/simongascoigne/sacs-14a_A/actions/workflows/update-and-deploy.yml/dispatches",
    {
      method: "POST",
      headers: {
        "Accept": "application/vnd.github+json",
        "Authorization": `Bearer ${env.GITHUB_TOKEN}`,
        "User-Agent": "Cloudflare-Worker-Scheduler",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ ref: "main" })
    }
  );
}
